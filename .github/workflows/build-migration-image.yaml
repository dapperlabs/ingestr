# Builds the migration image on a native amd64 runner (CGO on — the stock
# Dockerfile) and pushes to the staging account's ECR.
#
# Why a workflow: the stock build needs CGO_ENABLED=1 (the spanner source drops
# out of the CLI registry without it — proven locally) and the QEMU-emulated
# amd64 build segfaults the Go toolchain on Apple Silicon. Native runners have
# neither problem.
name: build-migration-image
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: migration # the OIDC trust pins this
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::908768512294:role/github-ingestr-ecr-push
          aws-region: us-west-2

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (stock Dockerfile, CGO on)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: 908768512294.dkr.ecr.us-west-2.amazonaws.com/ingestr:dapper-fix-${{ github.run_id }}
